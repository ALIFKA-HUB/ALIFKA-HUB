# ═══════════════════════════════════════════════════════════════════════════
# 🐍 GitHub Contribution Snake Animation
# Generates snake animation from GitHub contribution graph
# Runs daily at 00:00 UTC and can be triggered manually
# ═══════════════════════════════════════════════════════════════════════════

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ALIFKA-HUB
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=39ff14&color_dots=#0d1117,#1a1b27,#6c3ce9,#00d4ff,#39ff14

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
